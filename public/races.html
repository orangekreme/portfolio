<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Race Bibs — Victoria Deng</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <script>
    /* Set the active profile pre-paint to avoid a flash of the wrong view. */
    (function () {
      var V = ['recruiter', 'friend', 'self'];
      var p = new URLSearchParams(location.search).get('view');
      var s = null; try { s = sessionStorage.getItem('vd-view'); } catch (e) {}
      var v = V.indexOf(p) > -1 ? p : (V.indexOf(s) > -1 ? s : 'recruiter');
      document.documentElement.setAttribute('data-view', v);
      if (V.indexOf(p) > -1) { try { sessionStorage.setItem('vd-view', v); } catch (e) {} }
    })();
  </script>
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-CTB0S0SWH2"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-CTB0S0SWH2');
  </script>
</head>
<body>

  <!-- Theme toggle -->
  <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <circle class="sun-body" cx="12" cy="12" r="4.5"/>
      <g class="sun-rays">
        <line x1="12" y1="2" x2="12" y2="4.5"/>
        <line x1="12" y1="19.5" x2="12" y2="22"/>
        <line x1="2" y1="12" x2="4.5" y2="12"/>
        <line x1="19.5" y1="12" x2="22" y2="12"/>
        <line x1="4.93" y1="4.93" x2="6.64" y2="6.64"/>
        <line x1="17.36" y1="17.36" x2="19.07" y2="19.07"/>
        <line x1="19.07" y1="4.93" x2="17.36" y2="6.64"/>
        <line x1="6.64" y1="17.36" x2="4.93" y2="19.07"/>
      </g>
      <path class="moon-arc" d="M 15 4 A 9 9 0 1 0 15 20"/>
      <path class="moon-arc" d="M 15 4 A 8 8 0 0 0 15 20"/>
    </svg>
  </button>
  <a href="index.html" class="back-nav">Back</a>
  <span class="page-num">Race Bibs</span>

  <main class="page-wrapper" style="max-width: 720px;">
    <header class="page-header">
      <h1 class="page-title">Race Bibs</h1>
    </header>

    <p class="travel-intro">Races I've run, collected as bibs.</p>

    <!-- Personal records — one line per distance -->
    <section class="pr-block" id="pr-block" style="display:none;">
      <h2 class="races-subhead">Personal Records</h2>
      <ul class="pr-lines" id="pr-lines"></ul>
    </section>

    <!-- All races, grouped by distance — each is a text link to its bib page -->
    <section class="race-list" id="race-list"></section>

  </main>

  <!-- Bib popup -->
  <div id="bib-modal" class="bib-modal-overlay">
    <div class="bib-modal-box">
      <button class="bib-modal-close" id="bib-modal-close" aria-label="Close">✕</button>
      <div class="bib-modal-content" id="bib-modal-content"></div>
    </div>
  </div>

  <script>
    const DISTANCE_ORDER = ['Marathon', 'Half Marathon', '10 Mile', '10k', '5k', 'Mile', '50k', 'Misc'];
    const DISTANCE_LABEL = {
      'Marathon':      'Marathon',
      'Half Marathon': 'Half Marathon',
      '10 Mile':       '10 Mile',
      '10k':           '10K',
      '5k':            '5K',
      'Mile':          'Mile',
      '50k':           '50K',
      'Misc':          'Misc',
    };
    const PR_DISTANCES = ['Marathon', 'Half Marathon', '10 Mile', '10k', '5k', 'Mile', '50k'];

    function parseTime(str) {
      if (!str) return Infinity;
      const parts = str.trim().split(':').map(Number);
      if (parts.some(isNaN)) return Infinity;
      if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
      if (parts.length === 2) return parts[0] * 60 + parts[1];
      return parts[0];
    }
    function distLabel(d) { return DISTANCE_LABEL[d] || d || 'Misc'; }
    function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }

    // ── Bib popup ───────────────────────────────────────────────────────────────
    const bibModal = document.getElementById('bib-modal');
    const bibContent = document.getElementById('bib-modal-content');
    function openBibModal(race) {
      const bib = race.bibImage
        ? '<div class="race-bib"><img src="' + race.bibImage + '" alt="' + esc(race.name) + ' bib" /></div>'
        : '<div class="race-bib race-bib--empty"><span>' + esc(distLabel(race.distance)) + '</span></div>';
      function row(label, val) {
        return val ? '<div class="rd-row"><span class="rd-label">' + label + '</span><span class="rd-val">' + val + '</span></div>' : '';
      }
      const grid =
        '<div class="race-detail-grid">' +
          row('Distance', esc(distLabel(race.distance))) +
          row('Date', esc(race.displayDate)) +
          row('Time', race.time ? '<span class="rd-time">' + esc(race.time) + '</span>' : '') +
        '</div>';
      const notes = race.notes ? '<p class="race-notes">' + esc(race.notes) + '</p>' : '';
      const strava = race.strava
        ? '<div class="race-strava-wrap"><a class="arcade-btn" href="' + race.strava + '" target="_blank" rel="noopener">▶ View on Strava ↗</a></div>'
        : '';
      bibContent.innerHTML =
        '<h2 class="bib-modal-title">' + esc(race.name) + '</h2>' +
        '<div class="race-layout">' +
          '<div class="race-col-bib">' + bib + '</div>' +
          '<div class="race-col-info">' + grid + notes + strava + '</div>' +
        '</div>';
      bibModal.classList.add('is-open');
      document.body.classList.add('pf-no-scroll');
    }
    function closeBibModal() {
      bibModal.classList.remove('is-open');
      document.body.classList.remove('pf-no-scroll');
    }
    document.getElementById('bib-modal-close').addEventListener('click', closeBibModal);
    bibModal.addEventListener('click', e => { if (e.target === bibModal) closeBibModal(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeBibModal(); });

    fetch('/api/races')
      .then(r => r.json())
      .then(data => {
        const list = document.getElementById('race-list');
        if (!data.races || !data.races.length) {
          list.innerHTML = '<p class="thoughts-empty">No races yet.</p>';
          return;
        }
        const races = data.races;

        // Group by distance
        const groups = {};
        races.forEach(race => {
          const key = race.distance || 'Misc';
          (groups[key] = groups[key] || []).push(race);
        });
        const orderedKeys = [
          ...DISTANCE_ORDER.filter(k => groups[k]),
          ...Object.keys(groups).filter(k => !DISTANCE_ORDER.includes(k)),
        ];

        // Fastest (PR) race object per distance
        const prByDist = {};
        PR_DISTANCES.forEach(dist => {
          const cands = (groups[dist] || []).filter(r => parseTime(r.time) < Infinity);
          if (cands.length) prByDist[dist] = cands.reduce((b, r) => parseTime(r.time) < parseTime(b.time) ? r : b);
        });

        // ── All races grouped by distance — each is a text link; PR is flagged ──
        const prTargetId = {};
        let counter = 0;
        orderedKeys.forEach(dist => {
          const group = groups[dist].slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));
          const block = document.createElement('div');
          block.className = 'race-dist';
          block.innerHTML = '<h3 class="race-dist-head">' + distLabel(dist) + '</h3>';

          group.forEach(race => {
            const id = 'race-' + (counter++);
            const isPR = prByDist[dist] === race;
            if (isPR) prTargetId[dist] = id;
            const a = document.createElement('a');
            a.className = 'race-line' + (isPR ? ' race-line--pr' : '');
            a.id = id;
            a.href = '#';
            a.addEventListener('click', e => { e.preventDefault(); openBibModal(race); });
            a.innerHTML =
              '<span class="race-line-name">' + (isPR ? '<span class="race-pr-badge">PR</span>' : '') + race.name + '</span>' +
              '<span class="race-line-meta">' +
                (race.displayDate ? '<span class="race-line-date">' + race.displayDate + '</span>' : '') +
                (race.time ? '<span class="race-line-time">' + race.time + '</span>' : '') +
                '<span class="race-line-arrow">→</span>' +
              '</span>';
            block.appendChild(a);
          });
          list.appendChild(block);
        });

        // ── Personal Records: one line per distance, click → scroll to that race ──
        const prLines = document.getElementById('pr-lines');
        PR_DISTANCES.forEach(dist => {
          const pr = prByDist[dist];
          if (!pr) return;
          const li = document.createElement('li');
          li.className = 'pr-line pr-line--link';
          li.innerHTML =
            '<span class="pr-line-dist">' + distLabel(dist) + '</span>' +
            '<span class="pr-line-name">' + pr.name + '</span>' +
            '<span class="pr-line-time">' + pr.time + '</span>';
          const target = prTargetId[dist];
          li.addEventListener('click', () => {
            const el = target && document.getElementById(target);
            if (!el) return;
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            el.classList.add('race-line--flash');
            setTimeout(() => el.classList.remove('race-line--flash'), 1200);
          });
          prLines.appendChild(li);
        });
        if (prLines.children.length) document.getElementById('pr-block').style.display = '';
      })
      .catch(() => {
        document.getElementById('race-list').innerHTML = '<p class="thoughts-empty">Could not load races.</p>';
      });
  </script>
  <script src="theme.js"></script>
  <script src="view.js"></script>

</body>
</html>
