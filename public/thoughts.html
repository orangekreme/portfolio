<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thoughts — Victoria Deng</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <script>
    /* Set the active profile pre-paint to avoid a flash of the wrong view. */
    (function () {
      var V = ['recruiter', 'friend', 'self'];
      var p = new URLSearchParams(location.search).get('view');
      var s = null; try { s = sessionStorage.getItem('vd-view'); } catch (e) {}
      var v = V.indexOf(p) > -1 ? p : (V.indexOf(s) > -1 ? s : 'recruiter');
      document.documentElement.setAttribute('data-view', v);
      if (V.indexOf(p) > -1) { try { sessionStorage.setItem('vd-view', v); } catch (e) {} }
    })();
  </script>
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-CTB0S0SWH2"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-CTB0S0SWH2');
  </script>
</head>
<body>

  <!-- Theme toggle -->
  <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <!-- Shared circle -->
      <circle class="sun-body" cx="12" cy="12" r="4.5"/>
      <!-- Sun rays -->
      <g class="sun-rays">
        <line x1="12" y1="2" x2="12" y2="4.5"/>
        <line x1="12" y1="19.5" x2="12" y2="22"/>
        <line x1="2" y1="12" x2="4.5" y2="12"/>
        <line x1="19.5" y1="12" x2="22" y2="12"/>
        <line x1="4.93" y1="4.93" x2="6.64" y2="6.64"/>
        <line x1="17.36" y1="17.36" x2="19.07" y2="19.07"/>
        <line x1="19.07" y1="4.93" x2="17.36" y2="6.64"/>
        <line x1="6.64" y1="17.36" x2="4.93" y2="19.07"/>
      </g>
      <!-- Two-arc crescent moon -->
      <path class="moon-arc" d="M 15 4 A 9 9 0 1 0 15 20"/>
      <path class="moon-arc" d="M 15 4 A 8 8 0 0 0 15 20"/>
    </svg>
  </button>

  <a href="index.html" class="back-nav">Back</a>
  <span class="page-num">III</span>

  <main class="page-wrapper">
    <header class="page-header">
      <span class="page-section-num">III — Thoughts</span>
      <h1 class="page-title">Thoughts</h1>
    </header>

    <p class="travel-intro">Writing on life, running, and everything in between.</p>

    <div class="thoughts-list" id="thoughts-list">
      <div class="thoughts-loading">Loading...</div>
    </div>
  </main>

  <script>
    const list = document.getElementById('thoughts-list');

    fetch('/api/thoughts')
      .then(r => r.json())
      .then(data => {
        if (!data.posts || !data.posts.length) {
          list.innerHTML = '<p class="thoughts-empty">No posts yet.</p>';
          return;
        }

        // Group posts by Month Year (e.g. "Jan 2025")
        const groups = [];
        data.posts.forEach(post => {
          const label = post.monthYear || '—';
          if (!groups.length || groups[groups.length - 1].label !== label) {
            groups.push({ label, posts: [] });
          }
          groups[groups.length - 1].posts.push(post);
        });

        list.innerHTML = groups.map(group => `
          <div class="thought-group">
            <span class="thought-group-date">${group.label}</span>
            <div class="thought-group-posts">
              ${group.posts.map(post => `
                <a href="post.html?slug=${encodeURIComponent(post.slug)}" class="thought-link">
                  ${post.title}
                </a>
              `).join('')}
            </div>
          </div>
        `).join('');
      })
      .catch(() => {
        list.innerHTML = '<p class="thoughts-empty">Could not load posts.</p>';
      });

  </script>
  <script src="theme.js"></script>
  <script src="view.js"></script>

</body>
</html>
